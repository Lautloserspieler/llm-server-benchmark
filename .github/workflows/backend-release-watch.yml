name: Backend release watch

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Allow a new proposal after a previous PR was closed (never duplicate an open or merged PR)
        type: boolean
        default: false
      backend:
        description: Backend to review
        type: choice
        options: [all, llama_cpp, vllm]
        default: all

permissions: {}

jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON((inputs.backend == 'llama_cpp' && '["llama_cpp"]') || (inputs.backend == 'vllm' && '["vllm"]') || '["llama_cpp","vllm"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-release-watch-review-${{ matrix.backend }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Review upstream releases
        id: check
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python scripts/backend_release_watch.py "$BACKEND" --report "$RUNNER_TEMP/backend-review.json"
          echo "update=$(jq -r .update "$RUNNER_TEMP/backend-review.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/backend-review.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.update == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Check proposed source changes
        if: steps.check.outputs.update == 'true'
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_backend_release_watch.py tests/test_config.py tests/test_backend_setup.py tests/test_runner.py tests/test_llama_cpp_setup.py -q --no-cov
          ruff check llmbench/config.py llmbench/backend_setup.py scripts/backend_release_watch.py

  propose:
    needs: review
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON((inputs.backend == 'llama_cpp' && '["llama_cpp"]') || (inputs.backend == 'vllm' && '["vllm"]') || '["llama_cpp","vllm"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-release-watch-propose-${{ matrix.backend }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Configure git credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Prepare candidate
        id: check
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python scripts/backend_release_watch.py "$BACKEND" --report "$RUNNER_TEMP/backend-review.json"
          echo "update=$(jq -r .update "$RUNNER_TEMP/backend-review.json")" >> "$GITHUB_OUTPUT"
          echo "candidate=$(jq -r .candidate "$RUNNER_TEMP/backend-review.json")" >> "$GITHUB_OUTPUT"
      - name: Check existing proposal
        if: steps.check.outputs.update == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND: ${{ matrix.backend }}
          CANDIDATE: ${{ steps.check.outputs.candidate }}
          FORCE: ${{ inputs.force || false }}
        run: |
          branch="bot/${BACKEND}-${CANDIDATE}"
          count=$(gh pr list --state all --head "$branch" --json state --jq \
            "[.[] | select(.state != \"CLOSED\" or \"$FORCE\" != \"true\")] | length")
          echo "exists=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open draft PR
        if: steps.check.outputs.update == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND: ${{ matrix.backend }}
          CANDIDATE: ${{ steps.check.outputs.candidate }}
        run: |
          branch="bot/${BACKEND}-${CANDIDATE}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            gh pr create --draft --base main --head "$branch" \
              --title "chore: review ${BACKEND} ${CANDIDATE} reference" \
              --body-file "$RUNNER_TEMP/backend-review.md"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          case "$BACKEND" in
            llama_cpp) git add llama-cpp-version.txt ;;
            vllm) git add llmbench/config.py llmbench/backend_setup.py tests/test_config.py tests/test_runner.py tests/test_backend_setup.py ;;
          esac
          git diff --cached --quiet && exit 0
          git commit -m "chore: propose ${BACKEND} ${CANDIDATE} reference"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "chore: review ${BACKEND} ${CANDIDATE} reference" \
            --body-file "$RUNNER_TEMP/backend-review.md"
