name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lautloserspieler/llm-server-benchmark

jobs:
  validate:
    name: Build, smoke-test and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build CUDA image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          provenance: false
          sbom: false

      - name: Smoke-test image without GPU
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker image inspect "$IMAGE" >/dev/null
          docker run --rm -e LLMBENCH_EXPECT_GPU=0 "$IMAGE" python -m llmbench --version
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.llmbench.cuda-architectures" }}')" = "89;120"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            test -x /opt/llama.cpp/llama-bench
            test -x /opt/llama.cpp/llama-server
            deps="$(ldd /opt/llama.cpp/llama-bench)"
            printf "%s\n" "$deps"
            printf "%s\n" "$deps" | grep -q "libcuda.so.1"
            missing="$(printf "%s\n" "$deps" | grep "not found" | grep -v "libcuda.so.1" || true)"
            test -z "$missing"
          '

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker image validation"
            echo ""
            echo "- Image: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- CUDA architectures: \`sm_89;sm_120\`"
            echo "- Trivy HIGH/CRITICAL scan: enforced"
            echo "- Published: no (validation image)"
            echo "- Build digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-quality:
    name: Release quality gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check
      - name: Quality checks
        run: |
          ruff check .
          mypy llmbench
          pytest -q
          pip-audit
          python -m build

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push'
    needs: [validate, release-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish CUDA image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          provenance: mode=max
          sbom: true

      - name: Pull and smoke-test published image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker run --rm -e LLMBENCH_EXPECT_GPU=0 "$IMAGE" python -m llmbench --version
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.llmbench.cuda-architectures" }}')" = "89;120"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Published Docker image"
            echo ""
            echo "- Registry: \`${IMAGE_NAME}\`"
            echo "- Immutable tag: \`sha-${GITHUB_SHA}\`"
            echo "- CUDA architectures: \`sm_89;sm_120\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- SBOM: enabled"
            echo "- Build provenance: mode=max"
            echo "- Publish gated by tests, lint, mypy, pip-audit and Trivy"
          } >> "$GITHUB_STEP_SUMMARY"
