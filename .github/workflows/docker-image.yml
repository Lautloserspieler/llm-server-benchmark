name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lautloserspieler/llm-server-benchmark

jobs:
  build:
    name: Build and smoke-test image
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build CUDA image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          # Docker's local image store cannot load an attested manifest list.
          # PR/manual jobs validate the runnable image; attestations are generated on publish.
          provenance: false
          sbom: false

      - name: Smoke-test image without GPU
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker image inspect "$IMAGE" >/dev/null
          docker run --rm -e LLMBENCH_EXPECT_GPU=0 "$IMAGE" python -m llmbench --version
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.llmbench.cuda-architectures" }}')" = "89;120"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            test -x /opt/llama.cpp/llama-bench
            test -x /opt/llama.cpp/llama-server
            deps="$(ldd /opt/llama.cpp/llama-bench)"
            printf "%s\n" "$deps"
            printf "%s\n" "$deps" | grep -q "libcuda.so.1"
            missing="$(printf "%s\n" "$deps" | grep "not found" | grep -v "libcuda.so.1" || true)"
            test -z "$missing"
          '

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker image validation"
            echo ""
            echo "- Image: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- CUDA architectures: \`sm_89;sm_120\`"
            echo "- Published: no (PR/manual validation only)"
            echo "- Build digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish CUDA image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          provenance: mode=max
          sbom: true

      - name: Pull and smoke-test published image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker run --rm -e LLMBENCH_EXPECT_GPU=0 "$IMAGE" python -m llmbench --version
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.llmbench.cuda-architectures" }}')" = "89;120"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            test -x /opt/llama.cpp/llama-bench
            test -x /opt/llama.cpp/llama-server
            deps="$(ldd /opt/llama.cpp/llama-bench)"
            printf "%s\n" "$deps"
            printf "%s\n" "$deps" | grep -q "libcuda.so.1"
            missing="$(printf "%s\n" "$deps" | grep "not found" | grep -v "libcuda.so.1" || true)"
            test -z "$missing"
          '

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Published Docker image"
            echo ""
            echo "- Registry: \`${IMAGE_NAME}\`"
            echo "- Immutable tag: \`sha-${GITHUB_SHA}\`"
            echo "- CUDA architectures: \`sm_89;sm_120\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "${{ steps.meta.outputs.tags }}"
            echo "- SBOM: enabled"
            echo "- Build provenance: mode=max"
          } >> "$GITHUB_STEP_SUMMARY"
