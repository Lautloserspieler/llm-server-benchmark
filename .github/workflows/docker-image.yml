name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "llmbench/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "compose.build.yaml"
      - "docker/**"
      - "scripts/docker_common.sh"
      - "scripts/DOCKER_BENCHMARK.ps1"
      - "llama-cpp-version.txt"
      - "pyproject.toml"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: ["main"]
    # PRs mit reinen Python-/Feature-Aenderungen werden bereits durch die
    # normale Testmatrix validiert. Den teuren CUDA-Image-Build starten wir
    # nur, wenn sich Docker-/Packaging-relevante Dateien aendern.
    #
    # Nach dem Merge auf main bleibt llmbench/** weiterhin im push-Filter,
    # damit GHCR/latest bei Python-Aenderungen aktualisiert wird.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "compose.build.yaml"
      - "docker/**"
      - "scripts/docker_common.sh"
      - "scripts/DOCKER_BENCHMARK.ps1"
      - "llama-cpp-version.txt"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lautloserspieler/llm-server-benchmark

jobs:
  validate:
    name: Build, smoke-test and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set daily security refresh key
        shell: bash
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build CUDA image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          provenance: false
          sbom: false

      - name: Smoke-test image without GPU
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker image inspect "$IMAGE" >/dev/null
          docker run --rm -e LLMBENCH_EXPECT_GPU=0 "$IMAGE" python -m llmbench --version
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.llmbench.cuda-architectures" }}')" = "89;120"

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Preserve Trivy results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Trivy to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  release-quality:
    name: Release quality gate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check
          ruff check .
          mypy llmbench
          pytest -q
          pip-audit
          python -m build

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    needs: [validate, release-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set daily security refresh key
        shell: bash
        run: echo "SECURITY_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish CUDA image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SECURITY_REFRESH=${{ env.SECURITY_REFRESH }}
          cache-from: type=gha,scope=llmbench-cuda
          cache-to: type=gha,mode=max,scope=llmbench-cuda
          provenance: mode=max
          sbom: true
      - name: Extract published SBOM by immutable digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" --format '{{ json .SBOM }}' > sbom.json
          jq -e 'type == "object" and length > 0' sbom.json >/dev/null
      - name: Preserve published SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
          if-no-files-found: error
