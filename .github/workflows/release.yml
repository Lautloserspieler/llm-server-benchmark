name: Manual release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a reviewable PR, or publish the reviewed version on main
        type: choice
        options: [prepare, publish]
        default: prepare
      version:
        description: Exact stable version without v (required for publish; choose version OR bump for prepare)
        type: string
        default: ''
      bump:
        description: Automatic version increment (prepare only)
        type: choice
        options: [none, patch, minor, major]
        default: none
      dry_run:
        description: Validate and preview without pushing, tagging or publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write # Explicit test/security/Docker dispatches for bot-created refs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare or validate release
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(prepare)
          if [[ "$MODE" == publish ]]; then args=(verify); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python scripts/release.py "${args[@]}" --version "$VERSION" --bump "$BUMP" \
            --notes "$RUNNER_TEMP/release-notes.md" --output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release source and packaging
        if: inputs.dry_run == false
        run: |
          python -m pip install -e '.[dev]'
          pip check
          ruff check .
          mypy llmbench scripts/qualification_preflight.py
          pytest -q
          pip-audit
          python -m build
      - name: Configure git credentials
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Open release preparation PR
        if: inputs.mode == 'prepare' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo '::error::Release branch already exists; review the existing proposal.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add VERSION pyproject.toml llmbench/__init__.py CHANGELOG.md CHANGELOG.en.md
          git commit -m "chore(release): v$VERSION"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "chore(release): v$VERSION" \
            --body-file "$RUNNER_TEMP/release-notes.md"
          gh workflow run tests.yml --ref "$branch"
          gh workflow run security.yml --ref "$branch"
      - name: Tag reviewed main and create release
        if: inputs.mode == 'publish' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          # A tag pushed with GITHUB_TOKEN does not trigger push workflows.
          gh workflow run docker-image.yml --ref "$tag"
          gh workflow run tests.yml --ref "$tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
