name: "Reusable: Apply PR Labels"

# Zentralisiert die Labeler-Ausfuehrung wie in JarvisCore.
# Andere PR-Workflows koennen diesen Workflow per workflow_call wiederverwenden.

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 01 - Labels anwenden
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/auto-label.yml
          sync-labels: true
