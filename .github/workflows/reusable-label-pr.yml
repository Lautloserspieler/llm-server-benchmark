name: "Reusable: Apply PR Labels"

# Zentralisiert die Labeler-Ausfuehrung wie in JarvisCore.
# Andere PR-Workflows koennen diesen Workflow per workflow_call wiederverwenden.

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 01 - Labels anwenden
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/auto-label.yml
          sync-labels: true
