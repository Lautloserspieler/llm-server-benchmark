name: Sync issue label palette

on:
  push:
    branches: [main]
    paths:
      - ".github/issue-labels.json"
      - ".github/workflows/sync-issue-labels.yml"
      - "scripts/sync_issue_labels.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without applying labels"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-label-palette
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Synchronize labels and roadmap issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate label configuration
        run: |
          python -c "import json; from scripts.sync_issue_labels import validate_config; validate_config(json.load(open('.github/issue-labels.json', encoding='utf-8')))"
      - name: Sync label colors and issue assignments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            python scripts/sync_issue_labels.py --dry-run
          else
            python scripts/sync_issue_labels.py
          fi
