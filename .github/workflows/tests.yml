name: Tests

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "llmbench/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "benchmark.example.yaml"
      - "setup.sh"
      - "setup.bat"
      - "START_BENCHMARK.sh"
      - "START_BENCHMARK.bat"
      - "scripts/**"
      - "docker/entrypoint.sh"
      - "compose.yaml"
      - "VERSION"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      platform: ${{ steps.filter.outputs.platform }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "platform=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"

          python=false
          platform=false
          packaging=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              llmbench/*|tests/*|pyproject.toml|requirements*.txt|benchmark.example.yaml)
                python=true
                ;;
            esac
            case "$file" in
              setup.sh|setup.bat|START_BENCHMARK.sh|START_BENCHMARK.bat|scripts/*|docker/entrypoint.sh|compose.yaml)
                platform=true
                ;;
            esac
            case "$file" in
              llmbench/*|pyproject.toml|requirements*.txt|README.md|LICENSE|VERSION)
                packaging=true
                ;;
            esac
          done <<< "$changed"

          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  cli:
    name: cli
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: No CLI-impacting changes
        if: needs.changes.outputs.python != 'true' && needs.changes.outputs.platform != 'true'
        run: echo "No CLI-impacting files changed; required cli check passes without a full environment setup."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.platform == 'true'

      - name: Set up Python 3.12
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.platform == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install llmbench
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.platform == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: CLI smoke tests
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.platform == 'true'
        shell: bash
        run: |
          set -euo pipefail
          llmbench --version
          llmbench --help
          for command in \
            setup init doctor run bootstrap \
            install-llama-cpp install-backend uninstall-backend \
            compare export download \
            stress-ttft stress-multitenant stress-oom stress-quant
          do
            llmbench "$command" --help >/dev/null
          done

  lint:
    name: Ruff
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    name: mypy
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy llmbench

  test:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install llmbench with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Pytest
        run: pytest -q

      - name: Validate Linux and Docker launchers
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          bash -n setup.sh
          bash -n START_BENCHMARK.sh
          bash -n scripts/docker_common.sh
          bash -n docker/entrypoint.sh
          docker compose -f compose.yaml config -q

      - name: Validate PowerShell launchers
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          $scripts = @(
            'scripts/START_BENCHMARK.ps1',
            'scripts/START_BENCHMARK_CORE.ps1',
            'scripts/ENSURE_PYTHON.ps1',
            'scripts/ENSURE_LLAMA_CPP.ps1',
            'scripts/DOCKER_BENCHMARK.ps1',
            'scripts/COMPARE_SERVERS.ps1',
            'scripts/DIAGNOSE_LLAMA_CRASH.ps1'
          )
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $script" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run coverage
        run: pytest --cov=llmbench --cov-report=term-missing --cov-report=xml --cov-fail-under=45

  packaging:
    name: Package smoke test
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel outside source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/llmbench-wheel-test
          /tmp/llmbench-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/llmbench-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/llmbench-wheel-test/bin/llmbench --version
          /tmp/llmbench-wheel-test/bin/llmbench --help >/dev/null
          /tmp/llmbench-wheel-test/bin/python -m pip check
