name: Tests

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install llmbench
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          llmbench --version
          llmbench --help
          for command in             setup init doctor run bootstrap             install-llama-cpp install-backend uninstall-backend             compare export download             stress-ttft stress-multitenant stress-oom stress-quant
          do
            llmbench "$command" --help >/dev/null
          done

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy llmbench

  test:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install llmbench with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Pytest
        run: pytest -q

      - name: Validate Linux and Docker launchers
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          bash -n setup.sh
          bash -n START_BENCHMARK.sh
          bash -n scripts/docker_common.sh
          bash -n docker/entrypoint.sh
          docker compose -f compose.yaml config -q

      - name: Validate PowerShell launchers
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          $scripts = @(
            'scripts/START_BENCHMARK.ps1',
            'scripts/START_BENCHMARK_CORE.ps1',
            'scripts/ENSURE_PYTHON.ps1',
            'scripts/ENSURE_LLAMA_CPP.ps1',
            'scripts/DOCKER_BENCHMARK.ps1',
            'scripts/COMPARE_SERVERS.ps1',
            'scripts/DIAGNOSE_LLAMA_CRASH.ps1'
          )
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $script" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run coverage
        run: |
          pytest --cov=llmbench --cov-report=term-missing --cov-report=xml --cov-fail-under=45
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo "Minimum required coverage: **45%**"
            echo ""
            echo "The threshold is intentionally a baseline and should be raised as coverage improves."
          } >> "$GITHUB_STEP_SUMMARY"

  packaging:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel outside source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/llmbench-wheel-test
          /tmp/llmbench-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/llmbench-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/llmbench-wheel-test/bin/llmbench --version
          /tmp/llmbench-wheel-test/bin/llmbench --help >/dev/null
          /tmp/llmbench-wheel-test/bin/python -m pip check
