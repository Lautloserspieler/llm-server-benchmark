name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: wiki-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Sync wiki/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Publish Markdown pages to GitHub Wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          mkdir "$WORK_DIR/wiki"
          cd "$WORK_DIR/wiki"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ASKPASS="$WORK_DIR/askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "${GH_TOKEN:-}" ;;
          esac
          EOF
          chmod 0700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          if git fetch --depth=1 origin master; then
            git checkout -q -B master FETCH_HEAD
          else
            echo "::warning::Wiki ist noch nicht initialisiert. Einmalig auf der GitHub-Wiki eine Home-Seite anlegen und danach diesen Workflow manuell starten."
            exit 0
          fi

          for source in "$GITHUB_WORKSPACE"/wiki/de/*.md; do
            page="$(basename "$source")"
            if [[ ! -f "$GITHUB_WORKSPACE/wiki/en/$page" ]]; then
              echo "::error::Englische Wiki-Seite fehlt fuer de/$page"
              exit 1
            fi
          done

          for source in "$GITHUB_WORKSPACE"/wiki/en/*.md; do
            page="$(basename "$source")"
            if [[ ! -f "$GITHUB_WORKSPACE/wiki/de/$page" ]]; then
              echo "::error::Deutsche Wiki-Seite fehlt fuer en/$page"
              exit 1
            fi
          done

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp "$GITHUB_WORKSPACE/wiki/Home.md" Home.md
          cp "$GITHUB_WORKSPACE/wiki/_Sidebar.md" _Sidebar.md
          cp "$GITHUB_WORKSPACE/wiki/_Footer.md" _Footer.md

          for source in "$GITHUB_WORKSPACE"/wiki/de/*.md; do
            cp "$source" "DE-$(basename "$source")"
          done

          for source in "$GITHUB_WORKSPACE"/wiki/en/*.md; do
            cp "$source" "EN-$(basename "$source")"
          done

          git add -A
          if git diff --cached --quiet; then
            echo "Wiki ist bereits aktuell."
            exit 0
          fi

          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
