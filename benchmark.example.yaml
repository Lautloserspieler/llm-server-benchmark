project:
  name: "Firmenweiter LLM Server Benchmark"
  # Ueberschrift dieses Servers im Vergleich. null = Hostname verwenden.
  server_name: null
  output_dir: "results"
  hash_models: true
  hash_tools: true

tools:
  llama_bench: "tools/llama.cpp/llama-bench.exe"
  llama_server: "tools/llama.cpp/llama-server.exe"

benchmark:
  repetitions: 5
  delay_seconds: 1
  batch_size: 2048
  ubatch_size: 512
  flash_attention: auto
  cache_type_k: f16
  cache_type_v: f16
  resource_sample_interval: 0.5
  timeout_seconds: 3600
  prompt_tokens: [512, 4096, 8192]
  generation_tokens: [128, 512]
  context_depths: [0, 8192, 32768, 65536, 130000]
  long_context_prompt_tokens: 512
  long_context_generation_tokens: 128

endpoint:
  enabled: false
  auto_start: true
  base_url: "http://127.0.0.1:8080"
  api_key: null
  context_size: 32768
  parallel_slots: 8
  concurrency: [1, 2, 4, 8]
  requests_per_level: 8
  warmup_requests: 2
  max_tokens: 256
  temperature: 0.0
  seed: 42
  ignore_eos: true
  timeout_seconds: 600
  startup_timeout_seconds: 300
  prompt: >-
    Erklaere in einem technisch praezisen Absatz, warum reproduzierbare Benchmarks
    fuer lokale LLM-Server wichtig sind.
  # dataset_path: "path/to/sharegpt_dataset.jsonl"
  chat_format: false

soak:
  enabled: true
  cpu_profile: null
  gpu_profile: null
  host: "127.0.0.1"
  cpu_port: 8090
  gpu_port: 8091
  duration_short_seconds: 300
  duration_long_seconds: 1800
  sample_interval_seconds: 2.0
  concurrency: 2
  max_tokens: 256
  temperature: 0.0
  seed: 42
  context_size: 8192
  startup_timeout_seconds: 300
  throttle_tps_drop_fraction: 0.15
  prompt: >-
    Beschreibe in mehreren Absaetzen, wie moderne GPUs und CPUs bei Dauerlast
    thermisch geregelt werden.

stress:
  # stress-ttft erhoeht die Parallelitaet deutlich ueber den normalen Endpoint-Test.
  ttft_concurrency: [1, 2, 4, 8, 16, 32]
  # stress-oom startet llama-server fuer jede Stufe neu. So wird sichtbar, ob
  # bereits das Anlegen des KV-Caches oder erst der lange Request scheitert.
  oom_contexts: [4096, 8192, 16384, 32768, 65536, 96000, 130000]

# Wird durch die automatische Modellerkennung ergaenzt. Gesplittete GGUFs
# (00001-of-XXXXX bis XXXXX-of-XXXXX) erscheinen dabei als genau ein Modell.
models:
