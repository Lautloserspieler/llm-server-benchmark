project:
  name: "Firmenweiter LLM Server Benchmark"
  # Ueberschrift dieses Servers im Vergleich. null = Hostname verwenden.
  server_name: null
  output_dir: "results"
  # SHA256 der Modelle bzw. der llama.cpp-Binaries berechnen.
  # Beides ist der Nachweis, dass zwei Server wirklich dasselbe getestet haben.
  hash_models: true
  hash_tools: true

tools:
  # Diese Pfade werden beim ersten Start automatisch gesetzt.
  llama_bench: "tools/llama.cpp/llama-bench.exe"
  llama_server: "tools/llama.cpp/llama-server.exe"

benchmark:
  repetitions: 5
  delay_seconds: 1
  batch_size: 2048
  ubatch_size: 512
  # auto, on oder off
  flash_attention: auto
  cache_type_k: f16
  cache_type_v: f16
  resource_sample_interval: 0.5
  # Obergrenze je Einzeltest. Ohne sie kann ein Lauf bei zu grosser
  # Kontexttiefe unbegrenzt haengen.
  timeout_seconds: 3600
  prompt_tokens: [512, 4096, 8192]
  generation_tokens: [128, 512]
  context_depths: [0, 8192, 32768, 65536, 130000]
  long_context_prompt_tokens: 512
  long_context_generation_tokens: 128

endpoint:
  enabled: false
  auto_start: true
  base_url: "http://127.0.0.1:8080"
  api_key: null
  context_size: 32768
  parallel_slots: 8
  concurrency: [1, 2, 4, 8]
  requests_per_level: 8
  # Aufwaermlaeufe vor der Messung, damit Concurrency 1 nicht den
  # Kaltstart des Servers mitmisst.
  warmup_requests: 2
  max_tokens: 256
  temperature: 0.0
  seed: 42
  # Feste Antwortlaenge erzwingen, sonst schwanken die Tokenzahlen
  # zwischen Laeufen und System-TPS wird unvergleichbar.
  ignore_eos: true
  timeout_seconds: 600
  startup_timeout_seconds: 300

  # Option 1: Einzelner fester Prompt fuer die Tests (Standard)
  prompt: >-
    Erklaere in einem technisch praezisen Absatz, warum reproduzierbare Benchmarks
    fuer lokale LLM-Server wichtig sind.
  
  # Option 2: Realistische Datensaetze (JSONL Format, pro Zeile ein JSON)
  # dataset_path: "path/to/sharegpt_dataset.jsonl"
  
  # Setze auf 'true', um den OpenAI-kompatiblen /v1/chat/completions Endpoint statt /completion zu nutzen (noetig bei Messages-Arrays in Datensaetzen)
  chat_format: false

soak:
  # Startet einen CPU-Only- und einen GPU-Server gleichzeitig und haelt beide
  # unter Dauerlast, um Throttling durch Temperatur sichtbar zu machen. Braucht
  # je Modell ein Profil mit gpu_layers: 0 (CPU) und eins mit gpu_layers != 0
  # (GPU) - `llmbench bootstrap` legt beide automatisch an.
  enabled: true
  # null = automatisch das erste Profil mit gpu_layers: 0 bzw. != 0 verwenden.
  cpu_profile: null
  gpu_profile: null
  host: "127.0.0.1"
  cpu_port: 8090
  gpu_port: 8091
  duration_short_seconds: 300
  duration_long_seconds: 1800
  sample_interval_seconds: 2.0
  concurrency: 2
  max_tokens: 256
  temperature: 0.0
  seed: 42
  context_size: 8192
  startup_timeout_seconds: 300
  # Ab diesem Rueckgang der Tokens/s zwischen frueher und spaeter Laufzeit
  # gilt Throttling als wahrscheinlich.
  throttle_tps_drop_fraction: 0.15
  prompt: >-
    Beschreibe in mehreren Absaetzen, wie moderne GPUs und CPUs bei Dauerlast
    thermisch geregelt werden.

# Wird durch die automatische Modellerkennung ergaenzt.
