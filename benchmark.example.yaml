project:
  name: "Firmenweiter LLM Server Benchmark"
  server_name: null
  output_dir: "results"
  hash_models: true

tools:
  # Diese Pfade werden beim ersten Start automatisch überschrieben.
  llama_bench: "tools/llama.cpp/llama-bench.exe"
  llama_server: "tools/llama.cpp/llama-server.exe"

benchmark:
  repetitions: 5
  delay_seconds: 1
  batch_size: 2048
  ubatch_size: 512
  flash_attention: auto
  cache_type_k: f16
  cache_type_v: f16
  resource_sample_interval: 0.5
  prompt_tokens: [512, 4096, 8192]
  generation_tokens: [128, 512]
  context_depths: [0, 8192, 32768, 65536, 130000]
  long_context_prompt_tokens: 512
  long_context_generation_tokens: 128

endpoint:
  enabled: false
  auto_start: true
  base_url: "http://127.0.0.1:8080"
  context_size: 32768
  parallel_slots: 8
  concurrency: [1, 2, 4, 8]
  requests_per_level: 8
  max_tokens: 256
  temperature: 0.0
  timeout_seconds: 600
  startup_timeout_seconds: 300
  prompt: >-
    Erkläre in einem technisch präzisen Absatz, warum reproduzierbare Benchmarks
    für lokale LLM-Server wichtig sind.

# Wird durch die automatische Modellerkennung ergänzt.
models: []
