name: llm-server-benchmark

services:
  llmbench:
    image: ${LLMBENCH_DOCKER_IMAGE:-ghcr.io/lautloserspieler/llm-server-benchmark:latest@sha256:9b61a21c55d0d803ae26cd33c29adf9f00ec12d0145490bcea033b843dbbcce3}
    hostname: ${LLMBENCH_HOSTNAME:-llmbench-docker}
    working_dir: /workspace
    stdin_open: true
    tty: true
    user: "${LLMBENCH_UID:-0}:${LLMBENCH_GID:-0}"
    environment:
      LLMBENCH_EXECUTION_ENV: docker
      LLMBENCH_CONTAINER_RUNTIME: docker
      LLMBENCH_CONTAINER_IMAGE_ID: ${LLMBENCH_CONTAINER_IMAGE_ID:-unknown}
      LLMBENCH_HOSTNAME: ${LLMBENCH_HOSTNAME:-llmbench-docker}
      LLMBENCH_EXPECT_GPU: ${LLMBENCH_EXPECT_GPU:-1}
      LLMBENCH_LANG: ${LLMBENCH_LANG:-}
      LLMBENCH_CUDA_DEVEL_IMAGE: ${LLMBENCH_CUDA_DEVEL_IMAGE:-nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:44a9504c6dfb50b1241464241b02a93871928f373de6f5a644cf5fe9f080aa63}
      LLMBENCH_CUDA_RUNTIME_IMAGE: ${LLMBENCH_CUDA_RUNTIME_IMAGE:-nvidia/cuda:13.2.1-runtime-ubuntu24.04@sha256:4c17c2e7474ca1d470428b25e87e95756f51e7da3b663859894a03bc5a7ebdae}
      LLMBENCH_LLAMA_CPP_COMMIT: ${LLMBENCH_LLAMA_CPP_COMMIT:-64a155d242cb427766055ea9caea6f34df1ca94b}
      LLMBENCH_CUDA_ARCHITECTURES: ${LLMBENCH_CUDA_ARCHITECTURES:-89;120}
      NVIDIA_VISIBLE_DEVICES: ${LLMBENCH_GPU_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /workspace/.cache/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${LLMBENCH_MODELS_DIR:-./models}
        target: /workspace/models
      - type: bind
        source: ${LLMBENCH_RESULTS_DIR:-./results}
        target: /workspace/results
      - type: bind
        source: ${LLMBENCH_CONFIG_FILE:-./benchmark.yaml}
        target: /workspace/benchmark.yaml
      - type: bind
        source: ${LLMBENCH_HF_CACHE_DIR:-./.cache/huggingface}
        target: /workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
