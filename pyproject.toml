[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-server-benchmark"
version = "1.6.0"
description = "Reproducible local LLM server benchmarking with llama.cpp, hardware telemetry, long-context and endpoint load tests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Erik Meyer"}]
dependencies = [
  "PyYAML>=6.0.1",
  "psutil>=5.9.8",
  "httpx>=0.27.0",
  "nvidia-ml-py>=12.560.30",
  "pydantic>=2.0",
  "reportlab>=4.0",
  "huggingface-hub>=0.23.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pip-audit>=2.9",
  "pypdf>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
include = ["llmbench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ARG", "SIM", "UP"]
ignore = ["E501"]

# Legacy V2 code still contains a small number of style/dead-code findings.
# Keep these narrowly scoped until the affected modules are cleaned up.
# Undefined names and other correctness errors remain CI-fatal.
[tool.ruff.lint.per-file-ignores]
"llmbench/cli.py" = ["F541"]
"llmbench/download.py" = ["F401", "F811", "ARG002", "W293"]
"llmbench/stress/multitenant.py" = ["F401", "F541", "W293"]
"llmbench/stress/oom.py" = ["F401", "F541", "W293"]
"llmbench/stress/quant.py" = ["F401", "F541", "F841", "W293"]
"tests/test_monitor.py" = ["W293"]

[tool.mypy]
python_version = "3.10"
files = ["llmbench"]
ignore_missing_imports = true
follow_imports = "silent"
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:randomly"
