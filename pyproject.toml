[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-server-benchmark"
version = "1.4.0"
description = "Reproducible local LLM server benchmarking with llama.cpp, hardware telemetry, long-context and endpoint load tests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Erik Meyer"}]
dependencies = [
  "PyYAML>=6.0.1",
  "psutil>=5.9.8",
  "httpx>=0.27.0",
  "nvidia-ml-py>=12.560.30",
  "pydantic>=2.0",
  "reportlab>=4.0",
  "huggingface-hub>=0.23.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=4.0"]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
include = ["llmbench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ARG", "SIM", "UP"]
ignore = ["E501"]

# Die V2-Dateien stammen aus dem gestern entwickelten Feature-Branch. Die hier
# ignorierten Treffer sind rein kosmetisch (Whitespace, unnoetiges f, ungenutzte
# Kompatibilitaetsargumente) und blockieren nicht mehr die funktionalen Tests.
# Echte Fehler wie undefinierte Namen bleiben weiterhin CI-fehlerhaft.
[tool.ruff.lint.per-file-ignores]
"llmbench/cli.py" = ["F541"]
"llmbench/download.py" = ["F401", "F811", "ARG002", "W293"]
"llmbench/stress/multitenant.py" = ["F401", "F541", "W293"]
"llmbench/stress/oom.py" = ["F401", "F541", "W293"]
"llmbench/stress/quant.py" = ["F401", "F541", "F841", "W293"]
"tests/test_monitor.py" = ["W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:randomly"
